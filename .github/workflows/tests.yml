name: Linux-Prüfung

on:
  push:
  pull_request:

jobs:
  syntax-und-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tkinter, pv und virtuellen Bildschirm installieren
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb pv desktop-file-utils
      - name: Bash-Syntax und CLI-Hilfe prüfen
        run: |
          bash -n disk-image.sh
          bash -n disk-image-pv.sh
          bash -n disk-image-ownership.sh
          bash -n disk-image-cli-launcher.sh
          bash disk-image.sh --help >/dev/null
      - name: GUI, Fortschritt und Updates prüfen
        run: xvfb-run -a python3 -m unittest -v test_gui.py test_progress.py test_update.py test_launchers.py test_ownership.py
